{{- define "main" -}}

<article class="article">

  {{ partial "page_header" . }}

  <div class="article-container">

    {{ if and (eq .Type "post") .TableOfContents }}
    <div class="post-with-toc">
      <div class="article-style">
        {{ .Content }}
      </div>
      <aside class="post-toc">
        <div class="post-toc-title">On this page</div>
        <nav>{{ .TableOfContents }}</nav>
      </aside>
    </div>
    {{ else }}
    <div class="article-style">
      {{ .Content }}
    </div>
    {{ end }}

    {{ partial "page_footer" . }}

  </div>
</article>

{{- end -}}
